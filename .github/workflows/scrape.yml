name: Carrefour price check

on:
  schedule:
    - cron: "15 4 * * *"   # 07:15 Nairobi time, every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Run scraper
        run: python scraper.py
      - name: Upload debug pages (only when a search failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
      - name: Commit prices and report
        if: success()
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Prices for $(TZ=Africa/Nairobi date +%F)"
          git push
